server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Filenames are stable across releases. Revalidate before using cached content.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /assets/downloads/ {
        add_header Content-Disposition 'attachment; filename="sift-beta.zip"';
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
