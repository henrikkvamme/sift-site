server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Filenames are stable across releases. Revalidate before using cached content.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Public artifacts are built and published with the Sift API deployment.
    location /downloads/ {
        proxy_pass https://api.sifttheweb.com/downloads/;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host api.sifttheweb.com;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/downloads/ {
        add_header Content-Disposition 'attachment; filename="sift-beta.zip"';
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
